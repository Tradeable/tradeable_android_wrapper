name: Publish wrapper

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Derive version from tag
        run: echo "WRAPPER_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build wrapper AAR
        run: ./build.sh
        env:
          BUILD_TYPE: release

      - name: Publish to GitHub Packages
        run: ./gradlew :tradeable-sdk:publishReleasePublicationToGitHubPackagesRepository -PwrapperVersion="$WRAPPER_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach AAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/tradeable-android-wrapper.aar
            output/version.txt
